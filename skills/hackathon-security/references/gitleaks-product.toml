# gitleaks-product.toml — gitleaks starter config for the PRODUCT repo (D57).
#
# Copy to the product repo root as `.gitleaks.toml` at FLEET-3 (product
# repo creation) and run:
#   gitleaks detect --no-git --config .gitleaks.toml --source . --verbose
# Expected on a clean tree: "no leaks found". Any finding is a STOP.
#
# The --no-git flag is load-bearing, not cosmetic: it makes gitleaks scan
# the working tree. Without it, gitleaks defaults to git-history mode —
# and on a NON-git directory (e.g. a bare fixture tree) it scans 0 bytes
# and still reports "no leaks found" (fail-open). Always check the
# "scanned ~N bytes" line: if it reads 0 bytes, the run proved nothing.
#
# This is deliberately NOT a copy of the kit's gate config
# (skills/frontend-kit/scripts/gate/.gitleaks.toml): that config
# allowlists kit-specific false-positive files — design/run-log.jsonl
# (tokensHash sha256), .impeccable/questions/seeds/*.json + seed-salt
# (32-hex roll keys), design/judge/round-*.md (stamped sha256 headers).
# NONE of those files exists in a fresh product repo, so allowlisting
# them here would exempt paths the product repo does not have — scope
# without a finding behind it, and a blind spot if a file of that name
# ever appears with a real secret in it.
#
# Rules for extending this file (same discipline as the kit config):
# - Keep [extend] useDefault = true. A config WITHOUT [extend] REPLACES
#   the defaults and silently disables every rule (verified against
#   gitleaks 8.30.1: a config with only [allowlist] reports "no leaks
#   found" even for a planted key) — never ship a config without it.
# - Add a path allowlist ONLY for a PROVEN false positive (a finding
#   reproduced, its value shown to be a hash/public identifier, not a
#   credential), path-only, never a content regex (gitleaks allowlist
#   fields combine with OR: a regex would exempt every matching secret
#   in every file). Record the proof + the backstop that still catches
#   a real secret in the allowlisted file (the secret-grep.sh pattern
#   runs over the same file).
# - If the config cannot be parsed, gitleaks exits non-zero and the
#   check FAILS closed — never work around that by dropping the config.
#
# Smoke-tested 2026-11-14 (gitleaks 8.30.1): flagged a planted
# sk-proj- key in a fixture tree, clean on a clean fixture tree.
# The live product-repo run (D57, before 16:00 on build day) is still
# owed — there is no product repo yet.

[extend]
useDefault = true
